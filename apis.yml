name: Promise
description: >-
  Promise is a government payments and relief-technology company (backed by 8vc)
  that provides AI-powered automation for state and local government agencies and
  utilities. Its platform helps agencies distribute relief faster and more securely,
  verify eligibility and income, audit programs for waste, fraud, and abuse, and
  offer flexible, AI-driven payment plans that recover revenue. Products include
  PromiseBenefits (relief-program distribution at scale), PromiseAudit (real-time
  waste/fraud/abuse detection), PromiseVerified (automated income verification), and
  PromisePay (AI-driven payment plans for utilities and government). Clients include
  Washington State, Mississippi, WSSC Water, Louisville Water, and Richmond DPU.
  Promise exposes no public developer API surface; this profile captures its
  security, compliance, and web presence.
